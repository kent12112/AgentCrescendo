[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-crescendo-api"
version = "0.1.0"
description = "Local control API for AgentCrescendo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
e2b = ["e2b-desktop>=2,<3", "playwright>=1.49,<2", "httpx>=0.28,<1", "websockets>=15,<17"]
groq = ["groq>=0.31,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["services/api", "packages/agent_runtime", "packages/security"]
include = ["crescendo_api*", "crescendo_agent*", "crescendo_security*"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "packages/security/tests", "packages/agent_runtime/tests"]

