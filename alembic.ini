# Learn: Start the Alembic configuration section.
[alembic]
# Learn: Locate env.py and versioned schema changes under services/api/migrations.
script_location = services/api/migrations
# Learn: Add the API source root for migration imports; this does not modify the database.
prepend_sys_path = services/api
# Learn: Use the platform path-list separator when interpreting path configuration.
path_separator = os

